services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: opinion
      POSTGRES_PASSWORD: opinion
      POSTGRES_DB: opinion
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - opinion-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opinion -d opinion"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  opinion-data:
