services:
  - type: web
    name: popular-opinion
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm build
    startCommand: corepack pnpm start
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: popular-opinion-db
          property: connectionString

databases:
  - name: popular-opinion-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []
